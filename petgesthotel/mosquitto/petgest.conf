# PetGestHotel: configuração do Mosquitto (chat em tempo real).
# Como instalar: ver mosquitto/README.md

# Os avisos só levam ids (o texto das mensagens nunca passa pelo Mosquitto),
# por isso os clientes podem ligar-se sem utilizador nem palavra-passe.
allow_anonymous true

# MQTT normal: o PHP publica aqui e a app Android subscreve aqui
listener 1883
protocol mqtt

# MQTT por WebSockets: os browsers (front-office e back-office) subscrevem aqui
listener 9001
protocol websockets
